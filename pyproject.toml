[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poser"
version = "0.1.0"
description = "Deterministic scene-driven neural rendering pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "pydantic>=2.8,<3.0"
]

[project.optional-dependencies]
test = [
  "pytest>=8.2,<9.0",
  "httpx>=0.27,<1.0"
]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
markers = [
  "core: deterministic unit/core tests",
  "integration: integration tests",
  "gpu: optional local inference tests"
]
